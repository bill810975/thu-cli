[package]
name = "thu-cli"
version = "0.1.3"
edition = "2021"
description = "Native Rust command-line clients for Tsinghua campus services and Learn"
license-file = "LICENSE"
repository = "https://github.com/bill810975/thu-cli"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "charset", "gzip"] }
reqwest_cookie_store = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
regex = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
rpassword = "7"
directories = "6"
zeroize = "1"
fs2 = "0.4"
libsm = "0.6"
hex = "0.4"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
cookie_store = "0.22"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
