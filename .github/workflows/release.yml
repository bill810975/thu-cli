name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME#v}" = "$cargo_version"
      - run: cargo fmt --all -- --check
      - name: Clippy advisory
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build-linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          asset="thu-cli-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${asset}/docs"
          cp target/release/thu-cli "dist/${asset}/"
          cp README.md README.zh-CN.md LICENSE "dist/${asset}/"
          cp docs/LICENSING.md "dist/${asset}/docs/"
          cp -R licenses "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
      - uses: actions/upload-artifact@v4
        with:
          name: thu-cli-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          asset="thu-cli-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          mkdir -p "dist/${asset}/docs"
          cp target/release/thu-cli.exe "dist/${asset}/"
          cp README.md README.zh-CN.md LICENSE "dist/${asset}/"
          cp docs/LICENSING.md "dist/${asset}/docs/"
          cp -R licenses "dist/${asset}/"
          (cd dist && 7z a "${asset}.zip" "${asset}")
      - uses: actions/upload-artifact@v4
        with:
          name: thu-cli-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and macOS targets
        run: |
          rustup show
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --locked --release --target x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p dist/thu-cli
          lipo -create \
            target/x86_64-apple-darwin/release/thu-cli \
            target/aarch64-apple-darwin/release/thu-cli \
            -output dist/thu-cli/thu-cli
      - name: Package
        shell: bash
        run: |
          asset="thu-cli-${GITHUB_REF_NAME}-macos-universal"
          mv dist/thu-cli "dist/${asset}"
          mkdir -p "dist/${asset}/docs"
          cp README.md README.zh-CN.md LICENSE "dist/${asset}/"
          cp docs/LICENSING.md "dist/${asset}/docs/"
          cp -R licenses "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
      - uses: actions/upload-artifact@v4
        with:
          name: thu-cli-macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "thu-cli $GITHUB_REF_NAME"
          fi
